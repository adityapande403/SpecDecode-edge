[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "specdecode-edge"
version = "0.1.0"
description = "Training and Deploying Speculative Decoding Models for Local LLM Inference"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "SpecDecode Edge ML Systems Team"}
]
dependencies = [
    "transformers>=4.48.0",
    "accelerate>=1.1.0",
    "safetensors>=0.4.0",
    "datasets>=3.0.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
